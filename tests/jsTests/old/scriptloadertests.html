        <script type="text/javascript">
            var test1 = false;
            var test2 = false;
            var test3 = false;
            test('All false', function() {
                notEqual(test1, true);
                notEqual(test2, true);
                notEqual(test3, true);
            });
            var scripts = ['loadertestscript1.js', 'loadertestscript2.js', 'loadertestscript3.js'];
            function scriptLoader(numscripts, i) {
                if (i === numscripts) { //done
                    onLoad();
                } else {
                    switch (i) {
                            case 0:
                                test('Before load of script1', function(){
                                notEqual(test1, true);
                                notEqual(test2, true);
                                notEqual(test3, true);    
                                });
                                break;
                            case 1:
                                test('before load of script2', function(){
                                equal(test1, true);
                                notEqual(test2, true);
                                notEqual(test3, true);    
                                });
                                break;
                            case 2:
                            test('before load of script3', function(){
                                equal(test1, true);
                                equal(test2, true);
                                notEqual(test3, true);    
                                });
                                break;
                        }
                    $.getScript(scripts[i]).done(function(data, textStatus) {
                        switch (i) {
                            case 0:
                                test('After load of script1', function(){
                                equal(test1, true);
                                notEqual(test2, true);
                                notEqual(test3, true);    
                                });
                                break;
                            case 1:
                                test('After load of script2', function(){
                                equal(test1, true);
                                equal(test2, true);
                                notEqual(test3, true);    
                                });
                                break;
                            case 2:
                            test('After load of script3', function(){
                                equal(test1, true);
                                equal(test2, true);
                                equal(test3, true);    
                                });
                                break;
                        }
                        if (textStatus) {
                            switch (i) {
                                case 0:
                                    break;
                                case 1:
                                    break;
                                case 2:
                                    break;
                            }
                            i++;
                            scriptLoader(numscripts, i);
                        }
                    });
                }
            }
            ;
            /**
             * Do any styling or activities required by the page
             * @returns {undefined}
             */
            function onLoad() {
                test('All true', function() {
                    equal(test1, true);
                    equal(test2, true);
                    equal(test3, true);
                });
            }
            ;
            scriptLoader(scripts.length, 0);

        </script>
