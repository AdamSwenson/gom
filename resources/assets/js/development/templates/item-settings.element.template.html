<!-- Template used by 'edit_element' to hold the fields and buttons for an individual element.  -->

<div>

    <!-- Nav tabs -->
    <ul class="nav nav-tabs" role="tablist">
        <li role="presentation"
            class=""
            v-for="tab in tabs">
            <a href="#{{tab}}{{index}}"
               aria-controls="{{tab}}{{index}}"
               role="tab"
               data-toggle="tab">{{ tab | capitalize }}</a>
        </li>
    </ul>

    <!-- Tab panes -->
    <div class="tab-content">
        <div role="tabpanel" class="tab-pane active " id="details{{index}}">
            <div class="row">
                <div class="col-md-12 list-group-item">
                    <h4 id="displayNumber">Element #{{ index }}</h4>

                    <h5>Element Response</h5>
                    <!-- element description (the "stock comment") -->
                    <div class="form-group">
                        <textarea
                                class="form-control"
                                rows="3"
                                placeholder="{{ placeholders.elementText }}"
                                v-model="commentText"></textarea>
                    </div>

                    <div class="form-group">
                        <!-- move -->
                        <span class="btn btn-info btn-sm handle">
                            <span class="glyphicon glyphicon-move" aria-hidden="true"></span> Move</span>

                        <!-- customize responses -->
                        <a class="btn btn-info btn-sm"
                           data-toggle="modal"
                           data-target="#commentForm{{ index }}">
                            <span class="glyphicon glyphicon-pencil" aria-hidden="true"></span> Customize Responses
                        </a>

                        <!-- 'comment form' displays the modal triggered by 'customize response' button -->
                        <!--@include('setup.partials.comment_form')-->

                        <!-- delete button -->
                        <a class="btn btn-danger btn-sm js-remove">
                            <span class="glyphicon glyphicon-minus" aria-hidden="true"></span> Delete
                        </a>
                    </div>
                </div>

            </div>
        </div>


        <div role="tabpanel" class="tab-pane " id="stats{{index}}">
            <p>Stats here</p>
        </div>

        <div role="tabpanel" class="tab-pane " id="history{{index}}">
            <p>Which exams clones of this item have been used on</p>
        </div>

        <div role="tabpanel" class="tab-pane fade" id="notes{{index}}">
            <p>Notes to self about item</p>
        </div>

    </div>
</div>
