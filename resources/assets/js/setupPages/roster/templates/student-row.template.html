<!-- template used by "edit_roster" to display one table row displaying a single student.
    Holds student lname, fname, id, email and delete button -->
<tr class="dataRow {{ isFailed }}"
    id="dataRow{{ rowId }}">
    <td>
        <input
                class="form-control"
                type="text"
                id="lastName"
                name="lastName{{ rowId }}"
                placeholder="Last Name"
                v-model="lastName"
        >
    </td>
    <td>
        <input
                class="form-control"
                type="text"
                id="firstName"
                name="firstName{{ rowId }}"
                placeholder="First Name"
                v-model="firstName"
        >
    </td>
    <td>
        <input
                class="form-control"
                type="text"
                id="studentIdentifier"
                placeholder="Student ID"
                name="studentIdentifier{{ rowId }}"
                v-model="studentId"
        >
    </td>
    <td>
        <input
                class="form-control"
                type="text"
                id="email"
                name="email{{ rowId }}"
                placeholder="Email"
                v-model="email"
        >
    </td>
    <td align="center" style="vertical-align: middle;">
        <a
                class="deleteStudentButton"
                data-rowid="{{ rowId }}"
                v-on:click="deleteStudent"
        >
            <span class="glyphicon glyphicon-remove" aria-hidden="true"></span>
        </a>
    </td>
    <input
            type="hidden"
            name="id{{ rowId }}"
            value="{{ studentRecordId }}"
    >
</tr>
