<!-- template used by 'grade_exam' to host -->
<div id="element{{ elementNumber }}"
     class="list-group-item elementPanel"
     data-element-index="{{ elementIndex }}"
     data-element-id="{{ elementId }}"
     data-comment-area-id="{{ commentAreaId  }}"
>
    <h5>{{ elementTitle }}</h5>
    <div class="row">
                <span class="col-lg-5 sliderContainer Q{{ questionNumber }}E{{ elementNumber }}">
                    <!-- score slider -->
                    <label for="{{ sliderId }}"></label>
                    <input id="{{ sliderId }}"
                           type="text"
                           class="slider"/>
                </span>

        <!-- comment area -->
                <span class="col-lg-7 commentContainer Q{{ questionNumber }}E{{ elementNumber }}">
                    <textarea id="{{ commentAreaId  }}"
                              class="form-control"
                              rows="4"
                              name="{{ commentAreaId  }}"
                              placeholder="No score for this element"
                    >{{ commentText }}</textarea>
                </span>
    </div>
</div>
