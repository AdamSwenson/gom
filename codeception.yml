actor: Tester
paths:
    tests: tests
    log: tests/_output
    data: tests/_data
    support: tests/_support
    envs: tests/_envs
settings:
    bootstrap: _bootstrap.php
    colors: true
    memory_limit: 1024M
    strict_xml: true #for jenkins
extensions:
    enabled:
        - Codeception\Extension\RunFailed
        - Codeception\Extension\Recorder
        - Codeception\Extension\Logger
        - Group\Setup
        - Group\Grade
    config:
        Codeception\Extension\Logger:
          - max_files: 20

        Codeception\Extension\Recorder:
          - delete_successful: true

modules:
    config:
        Db:
            dsn: 'mysql:host=localhost;dbname=gom_testing'
            user: 'testuser4'
            password: 'testpass4'
            dump: tests/_data/dump.sql
            populate: true,
            cleanup: true
